name: Release

on:
  push:
    branches:
      - main
      - feat/shutter-operation-state

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/inels_cloud/manifest.json"))["version"])')"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read version from manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # Publish stable releases only from main. A version containing a
          # prerelease suffix (for example 0.1.10-beta.1) may be published
          # from the dedicated test branch.
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$VERSION" == *-* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: non-main branch has a stable version."
          fi

      - name: Check whether tag already exists
        id: tag
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        if: steps.version.outputs.publish == 'true' && steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
